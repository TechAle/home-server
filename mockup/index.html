<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home Server · Mockup</title>
    <script>
      // tema applicato prima del paint per evitare flash
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("home-theme") || "light";
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ============ LOGIN (notte) ============ -->
    <section id="screen-login" class="screen is-active" aria-label="Login">
      <div id="vanta-bg" class="vanta-bg"></div>
      <div class="night-veil"></div>

      <div class="login-shell">
        <div class="login-card" id="login-card">
          <div class="brand">
            <span class="brand-dot"></span>
            <span class="brand-name">home<span class="brand-dim">.server</span></span>
          </div>

          <p class="eyebrow">Raspberry Pi · sempre acceso</p>
          <h1>Welcome to Home</h1>
          <p class="muted">Accedi per gestire il tuo home server.</p>

          <form id="login-form" novalidate>
            <label for="password">Password</label>
            <div class="input-wrap">
              <input
                id="password"
                name="password"
                type="password"
                placeholder="••••••••"
                autocomplete="current-password"
                aria-describedby="login-error"
                required
              />
              <button type="button" class="ghost-icon" id="toggle-password" aria-label="Mostra password">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
                  <circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
                </svg>
              </button>
            </div>

            <p id="login-error" class="error" role="alert" aria-live="polite"></p>

            <button type="submit" class="btn-primary" id="login-submit">
              <span>Entra</span>
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>

          <p class="hint">scratch · <code>12345</code></p>
        </div>

        <p class="login-footer">
          <span class="live-dot"></span> server online · 192.168.1.42
        </p>
      </div>
    </section>

    <!-- ============ HOME (giorno) ============ -->
    <section id="screen-home" class="screen" aria-label="Home">
      <div class="day-bg" aria-hidden="true">
        <div class="sun"></div>
        <div class="moon"></div>
        <div class="cloud cloud-a"></div>
        <div class="cloud cloud-b"></div>
      </div>

      <header class="topbar">
        <button
          class="menu-toggle"
          id="menu-toggle"
          aria-label="Apri menu"
          aria-expanded="false"
          aria-controls="drawer"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          </svg>
        </button>

        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-name">home<span class="brand-dim">.server</span></span>
        </div>

        <nav class="main-nav" id="nav-main" aria-label="Sezioni"></nav>

        <div class="topbar-right">
          <button
            class="btn-ghost theme-toggle"
            id="theme-toggle"
            aria-label="Attiva tema scuro"
            aria-pressed="false"
          >
            <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            </svg>
          </button>
          <span class="clock" id="clock">—</span>
          <button class="btn-ghost" id="logout">Esci</button>
        </div>
      </header>

      <!-- Menu a scomparsa per schermi stretti -->
      <div class="drawer-backdrop" id="drawer-backdrop"></div>
      <aside class="drawer" id="drawer" aria-label="Menu di navigazione" aria-hidden="true">
        <div class="drawer-head">
          <div class="brand">
            <span class="brand-dot"></span>
            <span class="brand-name">home<span class="brand-dim">.server</span></span>
          </div>
          <button class="drawer-close" id="drawer-close" aria-label="Chiudi menu">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <nav class="drawer-nav" id="nav-drawer" aria-label="Sezioni"></nav>

        <div class="drawer-foot">
          <button class="btn-ghost drawer-logout" id="drawer-logout">Esci</button>
          <p class="muted small">raspberrypi · online</p>
        </div>
      </aside>

      <main class="content">
        <div class="page-head">
          <div>
            <p class="eyebrow">Buongiorno, Ale</p>
            <h2 id="view-title">Dashboard</h2>
            <p class="muted" id="view-sub">Stato dei servizi</p>
          </div>
          <div class="status-pill">
            <span class="live-dot"></span>
            Online · uptime <strong id="uptime">—</strong>
          </div>
        </div>

        <div id="view-root"></div>
      </main>

      <div class="modal-backdrop" id="modal" aria-hidden="true">
        <div
          class="modal-card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modal-title"
          aria-describedby="modal-text"
          tabindex="-1"
        >
          <button class="modal-close" id="modal-close" aria-label="Chiudi">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="modal-icon" id="modal-icon"></div>
          <h3 id="modal-title">Titolo</h3>
          <p class="muted" id="modal-text"></p>
          <div class="modal-actions" id="modal-actions"></div>
        </div>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
