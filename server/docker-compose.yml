services:
  server:
    build: .
    image: home-server:latest
    container_name: home-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Host networking: the API binds loopback only and can reach the host
      # Foundry helper on 127.0.0.1.
      HOST: 127.0.0.1
      PORT: "5000"
      TRUST_PROXY: "1"
      FOUNDRY_CONTROL_URL: http://127.0.0.1:5050
    network_mode: host
    volumes:
      # SQLite lives in server/data on the host, owned by uid 1000 (node).
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
