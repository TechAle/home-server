services:
  server:
    build: .
    image: home-server:latest
    container_name: home-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Caddy on the host proxies to this container; trust its X-Forwarded-For.
      HOST: 0.0.0.0
      PORT: "5000"
      TRUST_PROXY: "1"
    ports:
      # Only the local reverse proxy may reach the API.
      - "127.0.0.1:5000:5000"
    volumes:
      # SQLite lives in server/data on the host, owned by uid 1000 (node).
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
